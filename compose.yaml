services:
  db:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - 127.0.0.1:5434:5432
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}

    command: server /data --console-address ":9001"
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes:
    - miniodata:/data  

  migrate:
    build: ./backend
    command: ["uv", "run", "--no-sync", "python", "scripts/migrate.py"]
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - db
      - minio
    restart: on-failure

  api:
    build: ./backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2

  frontend:
    build: ./frontend
    depends_on:
      - api
    deploy:
      replicas: 2
  
  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 127.0.0.1:8080:80
    depends_on:
      - api
      - frontend    
      
    


volumes:
  pgdata: 
  miniodata:
       