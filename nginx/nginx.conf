events {}

http {
  client_max_body_size 10m;

  upstream api {
    server api:8000;
  }

  upstream frontend {
    server frontend:3000;
  }

  server {
    listen 80;
    location ~ ^/(webhook|health|ready|products) {
      proxy_pass http://api;
    }

    location / {
      proxy_pass http://frontend;
    }
  }
}